set -g status on
set -g message-line 0
# status-left is "[#{session_name}] ", truncated to status-left-length (default
# 10) — anything past ~8 characters gets cut off. This only raises the
# truncation cap; it doesn't reserve/pad space, so it has no effect on where
# the window tabs start for a short name (verified in an isolated tmux
# server).
set -g status-left-length 60
set -g  default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -ag terminal-overrides  ',*:Tc'
set -g  allow-passthrough on
set -g  focus-events on

# Forward modified keys (Shift+Enter, etc.) through to modern TUI apps.
# Codex only enables tmux's enhanced key reporting when the output stays CSI-u.
set -s  extended-keys on
set -s  extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g prefix C-b
bind-key C-b send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

# Default is 2000 lines, which is roughly one screenful of a busy agent
# session — not enough scrollback to be worth scrolling to.
set -g history-limit 50000

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy" # copy to macOS clipboard with "y"
bind-key p paste-buffer # paste with "p"

# Mouse drag release copies the selection to the macOS clipboard and exits copy mode.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Let OSC 52 / clipboard integration through as well.
set -g set-clipboard on

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# Free Ctrl+L for the shell's clear-screen (same as bare WezTerm);
# use Alt+L instead for navigating to the right pane.
set -g @vim_navigator_mapping_right 'M-l'
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'catppuccin/tmux#v2.3.0'
# Theme follows macOS appearance; toggled manually via prefix+T (see below).
# The plugin itself sets status line, message/command-prompt, copy-mode, and
# pane-border colors from this flavor — no manual style overrides needed.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    "set -g @catppuccin_flavor 'mocha'" \
    "set -g @catppuccin_flavor 'latte'"

# Catppuccin's default status bar background is "mantle", a near-black
# colour. This sets it to the flavor's "blue" instead. Must be set before
# tpm runs below — the plugin uses this same value to colour the
# window-separator triangles, so setting it after tpm runs (via a raw
# status-style override) leaves the separators mismatched against the bar.
set -g @catppuccin_status_background '#{@thm_blue}'

# window-status-separator (a native tmux option, not a catppuccin one)
# defaults to a single space drawn in the ambient status-style. Against the
# old near-black bar that space was invisible; against the blue bar above it
# shows as a visible gap between chips. Catppuccin already draws its own
# separator glyph inside each chip, so drop this redundant one.
set -g window-status-separator ''

# Prefix+T: re-detect appearance and reload theme
bind T run-shell '~/.tmux/plugins/tpm/tpm && tmux source-file ~/.tmux.conf' \; display "theme reloaded"
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes


set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'
set -g @continuum-restore 'off'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overrides below must come AFTER the tpm run above — catppuccin.tmux sets
# message-style/message-command-style on load, and config runs top-to-bottom.
#
# catppuccin's default message-style has no width/fill attributes, so the
# command-prompt (prefix+:) is drawn only as wide as its own text, on top of
# whatever was already in the window-tab/status-right cells — tmux's status
# redraw only repaints cells that actually change, so any tab/hostname text
# you don't happen to retype over just stays put. `width=100%,fill=...` are
# tmux's own documented attributes (see message-style in the tmux(1) STYLES
# section) for making the prompt actually clear and fill the whole line, the
# classic single-line "clean footer" behavior — verified in an isolated tmux
# server before applying here.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    "set -g message-style 'bg=#cba6f7,fg=#11111b,bold,fill=#cba6f7,width=100%,align=left'; set -g message-command-style 'bg=#cba6f7,fg=#11111b,bold,fill=#cba6f7,width=100%,align=left'" \
    "set -g message-style 'bg=#8839ef,fg=#eff1f5,bold,fill=#8839ef,width=100%,align=left'; set -g message-command-style 'bg=#8839ef,fg=#eff1f5,bold,fill=#8839ef,width=100%,align=left'"

# catppuccin always pairs status-style with fg=@thm_fg (a light colour),
# regardless of the background chosen above. Force dark text instead — bg is
# repeated here (not just fg) because tmux style options aren't incremental;
# setting only "fg=..." would reset bg to the terminal default.
set -gF status-style "bg=#{@thm_blue},fg=#{@thm_crust}"

# catppuccin's default window-tab format shows #T (the active pane's title —
# e.g. a shell's hostname, or a Claude Code session's task description)
# instead of #W (the window name set by rename-window/automatic-rename), and
# every tab is sized to its own name rather than lining up with the others.
# equalize-window-tabs.sh rewrites window-status-format/
# window-status-current-format to use #W, padded/truncated to the longest
# window name currently open in the session — re-run on every window
# create/rename/close via the hooks below so tabs stay aligned as the window
# list changes. Runs once here too, since hooks only fire on later events,
# not for windows that already exist when this file is sourced.
run-shell '~/Workspace/dotfiles/tmux/scripts/equalize-window-tabs.sh "#{session_name}"'
set-hook -g window-linked 'run-shell "~/Workspace/dotfiles/tmux/scripts/equalize-window-tabs.sh \"#{session_name}\""'
set-hook -g window-renamed 'run-shell "~/Workspace/dotfiles/tmux/scripts/equalize-window-tabs.sh \"#{session_name}\""'
set-hook -g window-unlinked 'run-shell "~/Workspace/dotfiles/tmux/scripts/equalize-window-tabs.sh \"#{session_name}\""'
